name: PrivateVote Midnight CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build Compact Circuits, Verify Managed Artifacts & Build dApp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Verify Compact Contract & Managed Circuit Artifacts
        run: |
          test -f public/contract/private_vote.compact
          test -f managed/private_vote/contract/index.js
          test -f managed/private_vote/contract/index.d.ts
          test -f managed/private_vote/zkir/private_vote.zkir
          test -f managed/private_vote/keys/private_vote.prover
          test -f managed/private_vote/keys/private_vote.verifier
          test -f managed/private_vote/compiler/contract-info.json
          test -f managed/private_vote/compiler/contract-manifest.json
          echo "All managed Compact artifacts & zero-knowledge circuit keys verified."

      - name: Run Compact Compiler Script
        run: |
          chmod +x scripts/compile_compact.sh
          ./scripts/compile_compact.sh public/contract/private_vote.compact managed/private_vote

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Static Production Web Application
        run: yarn build
        env:
          CI: false
          SKIP_PREFLIGHT_CHECK: "true"